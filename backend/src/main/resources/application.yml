server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-fullstack-interview
  datasource:
    url: jdbc:h2:mem:interview;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.lcysgsg.interview: INFO
