name: Baseline Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test backend
        working-directory: backend
        run: mvn -B package
      - name: Verify running API
        shell: bash
        run: |
          java -jar backend/target/ai-fullstack-interview-backend-0.0.1-SNAPSHOT.jar > /tmp/fullstack-api.log 2>&1 &
          trap 'cat /tmp/fullstack-api.log' ERR
          node scripts/baseline-http-smoke.mjs

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify frontend HTTP startup
        shell: bash
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/fullstack-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /tmp/fullstack-index.html; then break; fi
            sleep 1
          done
          grep -q '<div id="app">' /tmp/fullstack-index.html
